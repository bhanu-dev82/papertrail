name: Keep Render demo awake

on:
  schedule:
    # Every 10 minutes; Render free spins down after 15 minutes idle.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 120 https://papertrail-6apc.onrender.com/api/health
